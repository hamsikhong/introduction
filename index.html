<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>바이브코딩 교사 포트폴리오</title>
  <meta name="description" content="바이브코딩으로 만든 수업용 웹사이트와 앱, 연수 이력을 모은 교사 포트폴리오">

  <!-- 글꼴: Google Fonts. 다른 글꼴을 쓰려면 이 줄과 style.css 맨 위의 글꼴 설정을 함께 바꾸세요. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 1. 칠판 영역: 이름, 소개, 이 페이지 QR ===== -->
  <header class="board">
    <div class="wrap board-in">
      <div class="who">
        <p class="eyebrow mono" id="eyebrow"></p>
        <h1 id="name">불러오는 중…</h1>
        <p class="role" id="role"></p>
        <p class="prompt mono" id="motto-line"><span class="gt">&gt;</span><span id="motto"></span><span class="caret" aria-hidden="true"></span></p>
        <p class="intro" id="intro"></p>
        <ul class="chalk-tags" id="tags"></ul>
      </div>

      <aside class="qr-card" aria-label="이 페이지 QR 코드">
        <div class="qr-label mono">이 페이지 바로가기</div>
        <div class="qr-box" id="site-qr"></div>
        <div class="qr-url mono" id="site-url"></div>
        <button class="btn small" id="copy-site">주소 복사</button>
      </aside>
    </div>
  </header>

  <main class="wrap">

    <!-- ===== 2. 만든 것들 (작품 목록은 data.json의 "작품"에서 불러옵니다) ===== -->
    <section id="works">
      <div class="sec-head">
        <h2>만든 것들</h2>
        <span class="count mono" id="works-count"></span>
        <div class="filters" role="group" aria-label="작품 종류">
          <button class="chip-btn on" data-filter="전체">전체</button>
          <button class="chip-btn" data-filter="웹사이트">웹사이트</button>
          <button class="chip-btn" data-filter="앱">앱</button>
        </div>
      </div>
      <div class="grid" id="works-grid"></div>
    </section>

    <!-- ===== 3. 연수 이력 (data.json의 "연수") ===== -->
    <section id="training">
      <div class="sec-head">
        <h2>연수 이력</h2>
        <span class="count mono" id="training-count"></span>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>기간</th><th>연수명</th><th>기관</th><th>구분</th><th class="num">시수</th></tr>
          </thead>
          <tbody id="training-rows"></tbody>
          <tfoot>
            <tr><td colspan="4">합계</td><td class="num" id="training-total"></td></tr>
          </tfoot>
        </table>
      </div>
    </section>

    <!-- ===== 4. 연락하기 (이메일·블로그가 비어 있으면 숨겨집니다) ===== -->
    <section id="contact" hidden>
      <div class="sec-head"><h2>연락하기</h2></div>
      <div class="contact" id="contact-body"></div>
    </section>

  </main>

  <footer><div class="wrap" id="footer"></div></footer>

  <!-- QR 크게 보기 창 -->
  <dialog id="zoom"></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- QR 코드를 만들어 주는 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
